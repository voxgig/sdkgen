# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # The setup actions below still bundle the deprecated Node 20 runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [24.x]

    runs-on: ${{ matrix.os }}

    # The npm package lives in ts/ (ts/ is the self-contained package root).
    # Run all shell steps there.
    defaults:
      run:
        working-directory: ts

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ matrix.node-version }}

    # The lanes in test/generatedcompile.test.ts skip a target whose
    # toolchain is missing, and the runners have none of the seven below
    # (#256). The pins and setups are voxgig/struct's, whose CI builds the
    # same languages.
    - name: Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: .github/*-requirements.txt
    - name: pytest
      run: python -m pip install --disable-pip-version-check -r ../.github/py-requirements.txt

    # ziglang on PyPI, pinned by wheel digest. Its package directory holds
    # the zig executable itself, which the lanes spawn directly.
    - name: Zig
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check --require-hashes \
          -r ../.github/zig-requirements.txt
        python -c 'import os, ziglang; print(os.path.dirname(ziglang.__file__))' >> "$GITHUB_PATH"

    # gh-actions-lua and luarocks compile with MSVC, which the Windows image
    # installs without setting its environment. Platform stays out: dotnet
    # reads it as a build property and the csharp lanes would build for it.
    - name: MSVC environment (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
        $out = Join-Path $env:RUNNER_TEMP 'vcvars.txt'
        cmd.exe /c "call `"$bat`" >nul && set > `"$out`""
        $path = $env:Path -split ';'
        foreach ($line in Get-Content $out) {
          if ($line -notmatch '^([^=]+)=(.*)$') { continue }
          $name = $Matches[1]; $value = $Matches[2]
          if ($name -ieq 'Path') {
            $value -split ';' | Where-Object { $_ -and ($path -notcontains $_) } | Add-Content $env:GITHUB_PATH
          } elseif ($name -ine 'Platform' -and [Environment]::GetEnvironmentVariable($name) -ne $value) {
            Add-Content $env:GITHUB_ENV "$name=$value"
          }
        }

    - name: Lua
      uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13
      with:
        luaVersion: '5.4'
    - name: LuaRocks
      uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6
    # The lanes run `lua5.4`, the name Debian and Homebrew install.
    - name: busted, dkjson and lua5.4
      shell: bash
      run: |
        luarocks install busted
        luarocks install dkjson
        bin="$(dirname "$(command -v lua)")"
        if [ "$RUNNER_OS" = Windows ]; then
          cp "$bin/lua.exe" "$bin/lua5.4.exe"
        else
          ln -sf lua "$bin/lua5.4"
        fi

    # setup-beam has no macOS build.
    - name: Elixir
      if: runner.os != 'macOS'
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
      with:
        otp-version: '27'
        elixir-version: '1.18'
    - name: Elixir (macOS)
      if: runner.os == 'macOS'
      run: brew install elixir

    - name: OCaml
      uses: ocaml/setup-ocaml@605a7e998e76e035b82c14d618a6e1010732c4ce # v3
      with:
        ocaml-compiler: '5'
    - name: ocamlc on PATH
      shell: bash
      run: opam var bin >> "$GITHUB_PATH"

    - name: Scala
      uses: VirtusLab/scala-cli-setup@c2c917d5764319353961bc4e53885c62d3a95db1 # v1

    - name: Clojure
      uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13
      with:
        cli: latest

    - run: npm ci
    - run: npm run build --if-present
    - run: npm test
