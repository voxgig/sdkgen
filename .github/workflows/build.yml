# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [24.x]

    runs-on: ${{ matrix.os }}

    # The npm package lives in ts/ (ts/ is the self-contained package root).
    # Run all shell steps there.
    defaults:
      run:
        working-directory: ts

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test

    # THE MIGRATED TARGETS' OWN SUITES.
    #
    # A target that moved into a package left sdkgen's guard suites — that is
    # what migrating means, and it is also how a migrated target quietly
    # stops being tested. These run the package's suite against the working
    # checkout (its devDependency on @voxgig/sdkgen is `file:../../ts`), so a
    # change to sdkgen that breaks a packaged target fails here rather than
    # in someone's install.
    #
    # `npm install`, not `npm ci`: the file: dependency resolves against the
    # checkout, so there is no lockfile to honour.
    - name: haskell package
      working-directory: packages/sdkgen-haskell
      run: npm install --no-audit --no-fund && npm test
