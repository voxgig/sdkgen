# Publishes @voxgig/sdkgen to npm on a `v*` tag push, via GitHub OIDC
# Trusted Publishing — no NPM_TOKEN secret. The `id-token: write`
# permission lets npm exchange a GitHub OIDC token for a short-lived
# publish credential, and provenance is attached automatically.
#
# The trusted publisher must be registered on npmjs.com for
# voxgig/sdkgen against THIS filename (publish.yml); renaming this file
# breaks publishing until the npm-side config is updated to match.
#
# The npm package lives in ts/, so all steps run there.
#
# Release flow:
#
#   1. bump ts/package.json
#   2. cd ts && npm run embed-version   <-- NOT optional, and NOT run here
#   3. npm install --package-lock-only  (npm ci below fails on a stale lock)
#   4. commit all four files, merge to main
#   5. push the v* tag
#
# Step 2 stamps the version into ts/bin/voxgig-sdkgen and into the bundled
# scaffold's manifest, ts/project/sdkgen-package.json — both COMMITTED files
# this workflow only reads. `npm test` catches a missed step (manifest.test.ts,
# "its version tracks the npm package"), so a stale stamp fails the release
# rather than shipping; step 3 is caught by `npm ci` refusing a lock that
# disagrees with package.json.

name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ts

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm >= 11.5.1.
      - name: Use a trusted-publishing capable npm
        run: npm install -g npm@latest

      # package-lock.json is committed here, so ci is safe and reproducible.
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish to npm
        run: npm publish --access public
